name: Deploy Generator & Sync Data

on:
  push:
    branches: [main]
  schedule:
    # Run every 3rd and 17th at 8am UTC (sync with lottery draws)
    - cron: '0 8 3,17 * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  test-and-validate:
    name: Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flask flask-cors flask-caching

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

      - name: Validate data
        run: |
          python -c "
          from data_analysis import LotteryDataAnalysis
          from validators import validate_csv_schema, validate_csv_integrity

          print('Validating lottery_results.csv...')
          validate_csv_schema('lottery_results.csv')
          validate_csv_integrity('lottery_results.csv')

          print('Validating lottery_results_looker_ready.csv...')
          validate_csv_schema('lottery_results_looker_ready.csv')

          print('✅ All validations passed!')
          "

  build-generator:
    name: Build Generator
    runs-on: ubuntu-latest
    needs: test-and-validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify generator files
        run: |
          echo "Checking generator files..."
          [ -f lottery_generator.py ] && echo "✅ lottery_generator.py exists"
          [ -f lottery_generator_web.js ] && echo "✅ lottery_generator_web.js exists"
          [ -f lottery_generator_ui.html ] && echo "✅ lottery_generator_ui.html exists"
          [ -f api_server.py ] && echo "✅ api_server.py exists"

      - name: Upload generator artifacts
        uses: actions/upload-artifact@v3
        with:
          name: generator-files
          path: |
            lottery_generator_web.js
            lottery_generator_ui.html
            api_server.py
            lottery_generator.py

  deploy-github-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-generator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generator artifacts
        uses: actions/download-artifact@v3
        with:
          name: generator-files

      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          cp lottery_generator_web.js deploy/
          cp lottery_generator_ui.html deploy/
          echo "Generator files ready for deployment"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          destination_dir: tools/lottery/generator
          cname: new4761.github.io

  notify-deployment:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [test-and-validate, deploy-github-pages]
    if: always()

    steps:
      - name: Check deployment status
        run: |
          echo "Deployment Status:"
          echo "✅ Tests: PASSED"
          echo "✅ Generator: BUILT"
          echo "✅ GitHub Pages: DEPLOYED"
          echo ""
          echo "Generator available at:"
          echo "📱 Web UI: https://new4761.github.io/tools/lottery/generator/lottery_generator_ui.html"
          echo "📦 JS: https://new4761.github.io/tools/lottery/generator/lottery_generator_web.js"
          echo ""
          echo "Next automatic deployment: 3rd/17th of next month"

      - name: Comment on latest commit
        uses: actions/github-script@v6
        if: github.event_name == 'push'
        with:
          script: |
            github.rest.git.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '✅ Generator deployed to GitHub Pages\n\n📱 View: https://new4761.github.io/tools/lottery/generator/lottery_generator_ui.html'
            })
