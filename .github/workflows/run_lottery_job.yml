name: Update Thai Lottery Data

on:
  schedule:
    - cron: '0 8 3,17 * *'  # Run at 15:00 Thailand time on 3rd and 17th
  workflow_dispatch:

jobs:
  update-lottery:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📝 Run query.py (fetch data)
        run: python query.py

      - name: 🔁 Run query_locker.py (transform data)
        run: python query_locker.py

      - name: 🔍 Show outputs
        run: |
          echo "📁 lottery_results.csv:"
          head -n 5 lottery_results.csv
          echo ""
          echo "📁 lottery_results_looker_ready.csv:"
          head -n 5 lottery_results_looker_ready.csv

      - name: ✅ Commit and push CSV updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git status
          git add lottery_results.csv lottery_results_looker_ready.csv
          git commit -m "🤖 Update lottery results on $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git pull --rebase origin main || echo "Nothing to rebase"
          git push

      - name: Check if lottery_results.csv changed
        id: lottery_changed
        run: |
          if git diff --quiet HEAD~1 HEAD -- lottery_results.csv >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site sync via repository dispatch
        if: steps.lottery_changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.NEW4761_SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing secret NEW4761_SITE_DISPATCH_TOKEN (required to trigger new4761.github.io workflow)"
            exit 1
          fi

          cat <<EOF > /tmp/dispatch.json
          {
            "event_type": "lottery-results-updated",
            "client_payload": {
              "source_repo": "${{ github.repository }}",
              "source_sha": "${{ github.sha }}",
              "source_ref": "${{ github.ref_name }}"
            }
          }
          EOF

          gh api repos/new4761/new4761.github.io/dispatches \
            --method POST \
            --input /tmp/dispatch.json

          echo "Triggered site sync for commit ${{ github.sha }}."

      - name: 🚀 Update Google Sheets from GitHub CSVs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          python update_sheet_from_github.py
