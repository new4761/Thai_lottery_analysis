name: Update Thai Lottery Data
concurrency:
  group: lottery-data-sync
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 8 3,17 * *'  # Run at 15:00 Thailand time on 3rd and 17th
  workflow_dispatch:
    inputs:
      start_date:
        description: "Manual start date (YYYY-MM-DD)"
        required: false
        type: string
      end_date:
        description: "Manual end date (YYYY-MM-DD)"
        required: false
        type: string
      overwrite_existing:
        description: "Overwrite rows in selected date range"
        required: false
        type: boolean
        default: false
      publish_updates:
        description: "Also publish updates to Google Sheets and trigger site deploy"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-lottery:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🧪 Run unit tests
        run: python -m unittest discover -s tests -v

      - name: 🧪 Capture previous lottery checksum
        id: lottery_before
        run: |
          if [ -f lottery_results.csv ]; then
            previous_hash=$(sha256sum lottery_results.csv | awk '{print $1}')
            previous_rows=$(( $(wc -l < lottery_results.csv) - 1 ))
            previous_latest=$(tail -n 1 lottery_results.csv | cut -d',' -f1)
          else
            previous_hash="missing"
            previous_rows="missing"
            previous_latest="missing"
          fi
          echo "hash=$previous_hash" >> "$GITHUB_OUTPUT"
          echo "rows=$previous_rows" >> "$GITHUB_OUTPUT"
          echo "latest_date=$previous_latest" >> "$GITHUB_OUTPUT"

      - name: 🛠️ Build manual query args
        id: query_args
        run: |
          query_args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.start_date }}" ]; then
              query_args="$query_args --start-date ${{ github.event.inputs.start_date }}"
            fi
            if [ -n "${{ github.event.inputs.end_date }}" ]; then
              query_args="$query_args --end-date ${{ github.event.inputs.end_date }}"
            fi
            if [ "${{ github.event.inputs.overwrite_existing }}" = "true" ]; then
              query_args="$query_args --overwrite-existing"
            fi
          fi
          echo "args=$query_args" >> "$GITHUB_OUTPUT"

      - name: 📝 Run query.py (fetch data)
        run: |
          if [ -n "${{ steps.query_args.outputs.args }}" ]; then
            echo "Running: python query.py${{ steps.query_args.outputs.args }}"
          else
            echo "Running: python query.py"
          fi
          python query.py${{ steps.query_args.outputs.args }}

      - name: 🧾 Compute post-sync checksum
        id: lottery_after
        run: |
          if [ -f lottery_results.csv ]; then
            current_hash=$(sha256sum lottery_results.csv | awk '{print $1}')
            current_rows=$(( $(wc -l < lottery_results.csv) - 1 ))
            current_latest=$(tail -n 1 lottery_results.csv | cut -d',' -f1)
          else
            current_hash="missing"
            current_rows="missing"
            current_latest="missing"
          fi

          generated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          if [ "$current_rows" != "missing" ] && [ "${{ steps.lottery_before.outputs.rows }}" != "missing" ]; then
            rows_added=$(( current_rows - ${{ steps.lottery_before.outputs.rows }} ))
          else
            rows_added="n/a"
          fi

          if [ "$current_rows" != "missing" ] && [ "${{ steps.lottery_before.outputs.rows }}" != "missing" ] && [ "$rows_added" -lt 0 ]; then
            rows_added="n/a"
          fi

          echo "hash=$current_hash" >> "$GITHUB_OUTPUT"
          echo "generated_at=$generated_at" >> "$GITHUB_OUTPUT"
          echo "rows=$current_rows" >> "$GITHUB_OUTPUT"
          echo "latest_date=$current_latest" >> "$GITHUB_OUTPUT"
          echo "rows_added=$rows_added" >> "$GITHUB_OUTPUT"
          echo "latest_before=${{ steps.lottery_before.outputs.latest_date }}" >> "$GITHUB_OUTPUT"
          echo "latest_after=$current_latest" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.lottery_before.outputs.hash }}" = "$current_hash" ] && [ "$current_hash" != "missing" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "change_reason=source-content-unchanged" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.lottery_before.outputs.hash }}" = "missing" ]; then
              echo "change_reason=first-sync-created-file" >> "$GITHUB_OUTPUT"
            elif [ "${{ steps.lottery_before.outputs.rows }}" != "missing" ] && [ "$current_rows" != "missing" ] && [ "$current_rows" -gt "${{ steps.lottery_before.outputs.rows }}" ]; then
              echo "change_reason=rows-added" >> "$GITHUB_OUTPUT"
            else
              echo "change_reason=content-replaced" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 🔁 Run query_locker.py (transform data)
        if: steps.lottery_after.outputs.changed == 'true'
        run: python query_locker.py

      - name: 🧾 Compute Looker checksum
        id: locker_after
        if: steps.lottery_after.outputs.changed == 'true'
        run: |
          if [ -f lottery_results_looker_ready.csv ]; then
            looker_hash=$(sha256sum lottery_results_looker_ready.csv | awk '{print $1}')
            looker_rows=$(( $(wc -l < lottery_results_looker_ready.csv) - 1 ))
          else
            looker_hash="missing"
            looker_rows="missing"
          fi
          echo "hash=$looker_hash" >> "$GITHUB_OUTPUT"
          echo "rows=$looker_rows" >> "$GITHUB_OUTPUT"

      - name: ⚠️ Validate transformed output
        if: steps.lottery_after.outputs.changed == 'true'
        run: |
          if [ ! -f lottery_results_looker_ready.csv ]; then
            echo "❌ Error: lottery_results_looker_ready.csv was not created"
            exit 1
          fi
          if [ "${{ steps.locker_after.outputs.rows }}" = "missing" ] || [ "${{ steps.locker_after.outputs.rows }}" = "0" ]; then
            echo "❌ Error: Looker transformed output is empty or invalid, aborting sync"
            exit 1
          fi

      - name: 🔍 Show outputs
        if: steps.lottery_after.outputs.changed == 'true'
        run: |
          echo "📁 lottery_results.csv:"
          head -n 5 lottery_results.csv
          echo ""
          echo "📁 lottery_results_looker_ready.csv:"
          head -n 5 lottery_results_looker_ready.csv

      - name: ✔️ Validate data integrity before publication
        if: steps.lottery_after.outputs.changed == 'true'
        run: |
          echo "Validating lottery_results.csv schema and data..."
          python validators.py lottery_results.csv "${{ steps.lottery_before.outputs.rows }}"

          echo "Validating lottery_results_looker_ready.csv format..."
          python -c "
          import validators
          info = validators.validate_looker_csv('lottery_results_looker_ready.csv')
          print(f'✅ Looker CSV valid: {info[\"row_count\"]} records across {info[\"unique_dates\"]} dates')
          "

      - name: ✅ Commit and push CSV updates
        id: lottery_push
        if: steps.lottery_after.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add lottery_results.csv lottery_results_looker_ready.csv

          if ! git diff --cached --quiet; then
            git commit -m "🤖 Update lottery results on $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          else
            echo "ℹ️ No changes to commit (CSV unchanged)"
          fi

      - name: Trigger site sync via repository dispatch
        if: |
          steps.lottery_after.outputs.changed == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_updates == 'true')
        env:
          GH_TOKEN: ${{ secrets.NEW4761_SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing secret NEW4761_SITE_DISPATCH_TOKEN (required to trigger new4761.github.io workflow)"
            exit 1
          fi

          if ! command -v gh &> /dev/null; then
            echo "GitHub CLI (gh) is not available in this runner."
            exit 1
          fi

          cat <<EOF > /tmp/dispatch.json
          {
            "event_type": "lottery-results-updated",
            "client_payload": {
              "source_repo": "${{ github.repository }}",
              "source_sha": "${{ github.sha }}",
              "source_ref": "${{ github.ref_name }}",
              "change_reason": "${{ steps.lottery_after.outputs.change_reason }}",
              "rows_before": "${{ steps.lottery_before.outputs.rows }}",
              "rows_after": "${{ steps.lottery_after.outputs.rows }}",
              "rows_added": "${{ steps.lottery_after.outputs.rows_added }}",
              "latest_before": "${{ steps.lottery_after.outputs.latest_before }}",
              "latest_after": "${{ steps.lottery_after.outputs.latest_after }}",
              "looker_rows": "${{ steps.locker_after.outputs.rows }}",
              "looker_csv_sha": "${{ steps.locker_after.outputs.hash }}",
              "lottery_results_csv_sha": "${{ steps.lottery_after.outputs.hash }}",
              "lottery_results_csv_sha_prev": "${{ steps.lottery_before.outputs.hash }}",
              "generated_at": "${{ steps.lottery_after.outputs.generated_at }}"
            }
          }
          EOF

          gh api repos/new4761/new4761.github.io/dispatches \
            --method POST \
            --input /tmp/dispatch.json

          echo "Triggered site sync for commit ${{ github.sha }}."

      - name: ✔️ Final validation before sheet publication
        if: |
          steps.lottery_after.outputs.changed == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_updates == 'true')
        run: |
          echo "Final validation before publishing to Google Sheets..."
          python validators.py lottery_results.csv "${{ steps.lottery_before.outputs.rows }}"
          python -c "
          import validators
          validators.validate_looker_csv('lottery_results_looker_ready.csv')
          print('✅ All validations passed - safe to publish')
          "

      - name: 🚀 Update Google Sheets from GitHub CSVs
        if: |
          steps.lottery_after.outputs.changed == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_updates == 'true')
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          python update_sheet_from_github.py

      - name: 🧾 Build sync summary
        if: always()
        run: |
          {
            echo "# Lottery Sync Run Summary"
            echo ""
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Workflow: ${{ github.workflow }}"
            echo "Event: ${{ github.event_name }}"
            echo "Ref: ${{ github.ref }}"
            echo "Commit: ${{ github.sha }}"
            echo "Manual mode: ${{ github.event_name == 'workflow_dispatch' }}"
            echo "Manual inputs:"
            echo "  start_date=${{ github.event.inputs.start_date }}"
            echo "  end_date=${{ github.event.inputs.end_date }}"
            echo "  overwrite_existing=${{ github.event.inputs.overwrite_existing }}"
            echo "  publish_updates=${{ github.event.inputs.publish_updates }}"
            echo ""
            echo "Lottery file:"
            echo "  changed=${{ steps.lottery_after.outputs.changed }}"
            echo "  change_reason=${{ steps.lottery_after.outputs.change_reason }}"
            echo "  rows_before=${{ steps.lottery_before.outputs.rows }}"
            echo "  rows_after=${{ steps.lottery_after.outputs.rows }}"
            echo "  rows_added=${{ steps.lottery_after.outputs.rows_added }}"
            echo "  latest_before=${{ steps.lottery_before.outputs.latest_date }}"
            echo "  latest_after=${{ steps.lottery_after.outputs.latest_after }}"
            echo "  hash_before=${{ steps.lottery_before.outputs.hash }}"
            echo "  hash_after=${{ steps.lottery_after.outputs.hash }}"
            echo "  query_generated_at=${{ steps.lottery_after.outputs.generated_at }}"
            if [ -f lottery_results_looker_ready.csv ]; then
              echo "Looker:"
              echo "  rows=${{ steps.locker_after.outputs.rows }}"
              echo "  hash=${{ steps.locker_after.outputs.hash }}"
            else
              echo "Looker: not available"
            fi
            echo ""
          } > lottery_sync_summary.md

      - name: 📦 Archive sync summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lottery-sync-summary-${{ github.run_id }}
          path: lottery_sync_summary.md
          retention-days: 30
